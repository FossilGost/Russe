{% macro illustrate(word, eager=false) -%}
{% set picture = illustrations.get(word.id|string) %}
{% if picture %}<figure class="word-illustration"><img src="{{ url_for('static', filename='illustrations/' ~ word.id ~ '.svg') }}" alt="{{ picture.caption }}" width="320" height="160" decoding="async" loading="{{ 'eager' if eager else 'lazy' }}"><figcaption>{{ picture.caption }}</figcaption></figure>{% endif %}
{%- endmacro %}
